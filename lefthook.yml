# Lefthook configuration for brew-auto-update
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  
  commands:
    # Format Code
    cargo-fmt:
      glob: "**/*.rs"
      run: cargo fmt --check

    # Lint Code
    cargo-clippy:
      glob: "**/*.rs"
      run: cargo clippy -- -D warnings
    
    # Validate plist template
    plist-check:
      glob: "*.plist.template"
      run: cargo run -q --bin audit -- plist {staged_files}
    
    # Check for secrets/tokens
    secrets-check:
      glob: "*"
      run: cargo run -q --bin audit -- secrets {staged_files}
    
    # Markdown linting
    markdown-lint:
      glob: "*.md"
      run: cargo run -q --bin audit -- markdown {staged_files}

pre-push:
  commands:
    # Run full test suite before push
    test:
      run: scripts/lefthook/test.sh
