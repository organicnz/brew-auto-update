[package]
name = "brew-auto-update"
version = "0.2.0"
edition = "2021"
description = "Automated Homebrew and NPM package management for macOS"
repository = "https://github.com/organicnz/brew-auto-update"
license = "MIT"

[[bin]]
name = "brew-auto-update"
path = "src/bin/main.rs"

[[bin]]
name = "install"
path = "src/bin/install.rs"

[[bin]]
name = "setup"
path = "src/bin/setup.rs"

[[bin]]
name = "audit"
path = "src/bin/audit.rs"

[dependencies]
chrono = "0.4"
fs2 = "0.4"
users = "0.11"
regex = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
wait-timeout = "0.2"
